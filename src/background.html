<!DOCTYPE html>
<html lang="en">
<head>
    <title>Background Classes in Tailwind css</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
     <div class="bg-red-500 h-96" style="background-image: url(image.png);">
        Hello Tailwind
    </div> 
     <div class="bg-red-500 h-96 bg-[url(image.png)] bg-no-repeat bg-center bg-contain" >
       Code Step By Step
    </div>
    <div class="gradient bg-gradient-to-b to-green-500 from-red-500 size-96">

    </div>
    <div class="gradient bg-gradient-to-l to-green-500 from-red-500 size-96">

    </div>
    <div class="gradient bg-gradient-to-tr to-yellow-500 from-blue-500 size-96">

    </div>
    <div class="size-96 m-32 shadow-orange-300 shadow-2xl">

    </div>
    <div class="size-96 m-32  shadow-inner shadow-orange-400">

    </div>
    <div>
    <h1 class="blur-sm">Blur Image</h1>
    <img src="image.png">
    <img class="blur-sm" src="image.png"><h1>blur-sm</h1>
    <img class="blur-md" src="image.png"><h1>blur-md</h1>
    <img class="blur-3xl" src="image.png"><h1>blur-3xl</h1>
    <img class="blur" src="image.png"><h1>blur</h1>
    </div>
    <div>
    <h1>Brightness</h1>
        <img src="image.png"/>
    <img class="brightness-150" src="image.png"><h1>brightness Effect</h1>
    </div>
    <div> 
        <h1 class="text-2xl color">Blur and Brightness</h1>
        <img class="brightness-200 blur-lg" src="image.png"></h1>
    </div>
    
</body> 
</html>
