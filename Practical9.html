<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM25070</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-5">

<div class="bg-white/10 backdrop-blur-lg border border-white/20 w-full max-w-xl rounded-3xl shadow-2xl p-6">

    <!-- Header -->
    <div class="text-center mb-6">
        <h1 class="text-4xl font-bold text-white">
            📝 Personal To-Do List
        </h1>
        <p class="text-slate-300 mt-2">
            Organize your daily goals efficiently
        </p>
    </div>

    <!-- Counter -->
    <div class="bg-slate-800 text-white text-center py-3 rounded-xl mb-5">
        Total Tasks:
        <span id="taskCount" class="font-bold text-cyan-400">0</span>
    </div>

    <!-- Inputs -->
    <div class="space-y-3 mb-6">

        <input
            id="taskInput"
            type="text"
            placeholder="Enter your task..."
            class="w-full bg-white/20 text-white placeholder-slate-300 border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400">

        <input
            id="deadline"
            type="datetime-local"
            class="w-full bg-white/20 text-white border border-white/20 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-400">

        <button
            onclick="addTask()"
            class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-semibold py-3 rounded-xl transition duration-300">
            + Add Task
        </button>

    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-4"></ul>

    <!-- Empty State -->
    <div id="emptyState" class="text-center text-slate-300 py-6">
        No tasks added yet 🚀
    </div>

</div>

<script>

let taskCount = 0;

function updateCounter() {
    document.getElementById("taskCount").textContent = taskCount;

    document.getElementById("emptyState").style.display =
        taskCount === 0 ? "block" : "none";
}

function addTask() {

    let input = document.getElementById("taskInput");
    let deadline = document.getElementById("deadline");

    let task = input.value.trim();
    let dateTime = deadline.value;

    if(task === "" || dateTime === "") {
        alert("Please enter task and deadline");
        return;
    }

    let formattedDate =
        new Date(dateTime).toLocaleString();

    let li = document.createElement("li");

    li.className =
    "bg-white/10 border border-white/20 backdrop-blur-md p-4 rounded-2xl flex justify-between items-center hover:scale-[1.02] transition";

    li.innerHTML = `
        <div>
            <div class="flex items-center gap-2">

                <p onclick="completeTask(this)"
                class="font-semibold text-white cursor-pointer">
                ${task}
                </p>

                <span class="bg-green-500 text-xs px-2 py-1 rounded-full text-white">
                    Pending
                </span>

            </div>

            <p class="text-sm text-slate-300 mt-1">
                ⏰ ${formattedDate}
            </p>
        </div>

        <button onclick="deleteTask(this)"
        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
        Delete
        </button>
    `;

    document.getElementById("taskList")
        .appendChild(li);

    taskCount++;
    updateCounter();

    input.value = "";
    deadline.value = "";
}

function completeTask(task) {

    task.classList.toggle("line-through");
    task.classList.toggle("text-slate-400");

    let badge =
        task.parentElement.querySelector("span");

    if(badge.textContent === "Pending") {
        badge.textContent = "Completed";
        badge.className =
        "bg-blue-500 text-xs px-2 py-1 rounded-full text-white";
    } else {
        badge.textContent = "Pending";
        badge.className =
        "bg-green-500 text-xs px-2 py-1 rounded-full text-white";
    }
}

function deleteTask(btn) {

    btn.parentElement.remove();

    taskCount--;
    updateCounter();
}

updateCounter();

</script>

</body>
</html>
